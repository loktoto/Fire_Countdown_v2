name: Apply issue 17 optional age

on:
  push:
    branches:
      - agent/issue-17-optional-current-age

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out issue branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/issue-17-optional-current-age

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact optional-age wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/FirePlanSettingsSheets.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import { fieldLabelWithUnit } from "./firePlanPresentation";',
                  'import { fieldLabelWithUnit, optionalCurrentAgeFromText } from "./firePlanPresentation";',
              ),
              (
                  '  const canSave =\n    name.trim().length > 0 &&\n    numberFromText(currentAge) > 0 &&\n    numberFromText(currentAge) <= 120 &&',
                  '  const parsedCurrentAge = optionalCurrentAgeFromText(currentAge);\n  const canSave =\n    name.trim().length > 0 &&\n    parsedCurrentAge !== undefined &&',
              ),
              (
                  '  function save() {\n    if (!canSave) {\n      return;\n    }\n\n    onSave(goal.id, {',
                  '  function save() {\n    const nextCurrentAge = optionalCurrentAgeFromText(currentAge);\n    if (!canSave || nextCurrentAge === undefined) {\n      return;\n    }\n\n    onSave(goal.id, {',
              ),
              (
                  '      currentAge: Math.max(1, Math.min(120, Math.floor(numberFromText(currentAge)))),',
                  '      currentAge: nextCurrentAge,',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          npx prettier --write \
            src/components/FirePlanSettingsSheets.tsx \
            src/components/firePlanPresentation.ts \
            src/components/__tests__/firePlanPresentation.test.ts
          git diff --check

      - name: Commit optional-age behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/FirePlanSettingsSheets.tsx \
            src/components/firePlanPresentation.ts \
            src/components/__tests__/firePlanPresentation.test.ts
          git commit -m "Allow clearing optional current age"
          git push origin HEAD:agent/issue-17-optional-current-age
