name: Apply issue 23 localization

on:
  push:
    branches:
      - agent/issue-23-time-lens-kicker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out issue branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/issue-23-time-lens-kicker

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact localization changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/components/TimeLens.tsx",
              '  const colors = useThemeColors();\n  const { width, height } = useWindowDimensions();',
              '  const colors = useThemeColors();\n  const t = useI18n();\n  const { width, height } = useWindowDimensions();',
          )
          replace_once(
              "src/components/TimeLens.tsx",
              '          TIME LENS',
              '          {t.timeLens.kicker}',
          )
          replace_once(
              "src/i18n/en.ts",
              '  timeLens: {\n    money: "Money",',
              '  timeLens: {\n    kicker: "TIME LENS",\n    money: "Money",',
          )
          replace_once(
              "src/i18n/zhHant.ts",
              '  timeLens: {\n    money: "金額",',
              '  timeLens: {\n    kicker: "時間透鏡",\n    money: "金額",',
          )
          replace_once(
              "src/i18n/__tests__/locales.test.ts",
              '    expect(zhHant.tabs.home).toBe("\\u9996\\u9801");\n    expect(JSON.stringify(zhHant)).not.toContain("\\uFFFD");',
              '    expect(zhHant.tabs.home).toBe("\\u9996\\u9801");\n    expect(zhHant.timeLens.kicker).toBe("時間透鏡");\n    expect(zhHant.timeLens.kicker).not.toContain("TIME LENS");\n    expect(JSON.stringify(zhHant)).not.toContain("\\uFFFD");',
          )
          PY
          npx prettier --write \
            src/components/TimeLens.tsx \
            src/i18n/en.ts \
            src/i18n/zhHant.ts \
            src/i18n/__tests__/locales.test.ts
          git diff --check

      - name: Commit localization fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/TimeLens.tsx \
            src/i18n/en.ts \
            src/i18n/zhHant.ts \
            src/i18n/__tests__/locales.test.ts
          git commit -m "Localize Time Lens kicker"
          git push origin HEAD:agent/issue-23-time-lens-kicker
