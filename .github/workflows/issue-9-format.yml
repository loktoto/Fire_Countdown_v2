name: Format issue 9 tests

on:
  push:
    branches:
      - agent/issue-9-monotonic-quote-cache

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out issue branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/issue-9-monotonic-quote-cache

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Format focused test
        run: |
          npx prettier --write src/data/__tests__/quoteCache.test.ts
          git diff --check

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/__tests__/quoteCache.test.ts
          git commit -m "Format quote cache tests"
          git push origin HEAD:agent/issue-9-monotonic-quote-cache
