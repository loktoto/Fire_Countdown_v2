jobs:
  quality:
    name: Typecheck, lint, format, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Jest deterministically
        run: npm test -- --runInBand --watch=false
''',
              encoding="utf-8",
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Apply canonical formatting
        run: |
          npx prettier --write \
            src/hooks/usePortfolioViewModel.ts \
            src/hooks/__tests__/usePortfolioViewModel.test.ts \
            src/screens/PortfolioScreen.tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Jest deterministically
        run: npm test -- --runInBand --watch=false

      - name: Commit validated refactor
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/source-quality.yml \
            src/hooks/usePortfolioViewModel.ts \
            src/hooks/__tests__/usePortfolioViewModel.test.ts \
            src/screens/PortfolioScreen.tsx
          git commit -m "Move Portfolio valuation shaping into view model"
          git push origin HEAD:agent/issue-35-portfolio-view-model
