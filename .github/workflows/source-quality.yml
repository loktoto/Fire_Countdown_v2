name: Source quality

on:
  pull_request:
  push:
    branches:
      - main
      - agent/issue-35-portfolio-view-model

permissions:
  contents: write

concurrency:
  group: source-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, and test
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Check out issue branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/issue-35-portfolio-view-model
          persist-credentials: true

      - name: Apply exact Portfolio screen changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/screens/PortfolioScreen.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          replace_once('import { resolveAssetValue } from "../engine/fireEngine";\n', '')
          replace_once(
              '''          {vm.assets.map((asset) => {
            const resolved = resolveAssetValue(asset, vm.quoteCache, goalCurrency);
            const latestQuote = vm.quoteCache
              .filter((quote) => quote.assetId === asset.id)
              .sort((a, b) => Date.parse(b.receivedAt) - Date.parse(a.receivedAt))[0];
            const quoteChange = latestQuote?.changePercent;
''',
              '''          {vm.assetRows.map(({ asset, latestQuote, quoteChange, resolution: resolved }) => {
''',
          )
          replace_once("          {vm.assets.length === 0 ? (\n", "          {vm.assetRows.length === 0 ? (\n")
          path.write_text(text, encoding="utf-8")

          Path(".github/workflows/source-quality.yml").write_text(
              '''name: Source quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: source-quality-${{ github.workflow }}-${{ github.ref }}
